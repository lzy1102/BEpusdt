<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEpusdt - 初始化完成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e6cf 0%, #56ab91 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 640px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #a8e6cf 0%, #56ab91 100%);
            color: white;
            padding: 18px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.95;
            font-size: 12px;
        }

        .content {
            padding: 20px 24px 24px;
        }

        .warning-banner {
            background: #fff4e6;
            border-left: 3px solid #ff9800;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 4px;
            color: #e65100;
        }

        .warning-banner strong {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .warning-banner p {
            font-size: 13px;
            line-height: 1.6;
        }

        .tips {
            background: #e8f8f0;
            border-left: 3px solid #74c69d;
            padding: 12px;
            border-radius: 4px;
        }

        .tips h4 {
            color: #2d6a4f;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .tips ul {
            color: #2d6a4f;
            margin-left: 18px;
            line-height: 1.8;
            font-size: 13px;
        }

        code {
            font-family: 'Courier New', monospace;
            background: #f1f5f9;
            padding: 1px 5px;
            border-radius: 3px;
            color: #0f172a;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎉 BEpusdt 初始化完成</h1>
            <p>首次运行检测通过</p>
        </div>

        <div class="content">
            <div class="warning-banner">
                <strong>⚠️ 初始化信息不会在页面展示</strong>
                <p>
                    后台登录账号、密码、安全入口和 API 对接令牌仅在<strong>首次启动日志</strong>中输出一次，
                    请立即保存到安全位置。出于安全考虑，这些信息不会通过网页再次提供。
                </p>
            </div>

            <div class="tips">
                <h4>📌 如何查看初始化信息</h4>
                <ul>
                    <li>Docker：<code>docker logs &lt;容器名或容器ID&gt;</code></li>
                    <li>systemd：<code>journalctl -u bepusdt.service</code>，或查看日志目录下的 <code>bepusdt.log</code></li>
                    <li>如果已经错过日志，可执行 <code>bepusdt reset</code> 重新生成后台账号和入口</li>
                    <li>API 令牌可在登录后台后于「系统设置」中重置</li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
